name: Desktop image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: dockerfile
        run: node scripts/write-desktop-dockerfile.ts "$RUNNER_TEMP/desktop-image"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          platforms: linux/amd64
          push: true
          load: false
          tags: ghcr.io/imamjabar/superbot-computer:${{ steps.dockerfile.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ghcr.io/imamjabar/superbot-computer:${{ steps.dockerfile.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE@$DIGEST")
          {
            echo "### Desktop image"
            echo "- Ref: \`$IMAGE@$DIGEST\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Size: $((size / 1024 / 1024)) MiB ($size bytes)"
            echo "- VPS: \`OMB_LOCAL_VM_IMAGE=$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
