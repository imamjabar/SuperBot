name: Desktop image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: dockerfile
        run: node scripts/write-desktop-dockerfile.ts "$RUNNER_TEMP/desktop-image"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          platforms: linux/amd64
          push: true
          load: false
          tags: ghcr.io/imamjabar/superbot-computer:${{ steps.dockerfile.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ghcr.io/imamjabar/superbot-computer:${{ steps.dockerfile.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST" >/dev/null
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE@$DIGEST")
          {
            echo "### Desktop image"
            echo "- Ref: \`$IMAGE@$DIGEST\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Size: $((size / 1024 / 1024)) MiB ($size bytes)"
            echo "- VPS: \`OMB_LOCAL_VM_IMAGE=$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
