name: Check
on:
  workflow_dispatch:
    inputs:
      probe_dist: { type: boolean, default: false, description: Also build the web and server bundles as a run artifact for a disposable VPS probe }
concurrency: { group: "check-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec oxlint --deny-warnings server shared
      - run: pnpm typecheck
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - run: >-
          pnpm vitest run
          server/routes/desktop-viewer.test.ts server/container-seats.test.ts server/local-vm-seat-idle.test.ts
          server/local-vm-seats.test.ts scripts/testing/file-size-ratchet.test.ts
          server/computer-control-release.test.ts server/card-dismissal.test.ts server/routes/bot-messages.test.ts
          server/surface.test.ts src/components/QuestionCard.answer.test.ts
          server/memory-stage.test.ts server/workspace.test.ts server/memory-forget.test.ts server/memory-journal.test.ts
          server/drivers/agents-call.test.ts server/independent-threads-api.test.ts
          server/turn-outcome.test.ts server/runtime/runtime.test.ts server/runtime/scenarios.test.ts server/runtime-roots.e2e.test.ts
      - run: pnpm vitest run server/index.test.ts -t "Local VM|computer|control"
  probe-dist:
    if: ${{ inputs.probe_dist }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vite build
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - run: pnpm build:server
      - run: |
          test -f dist-server/index.js && test -f dist-server/server-launcher.js
          find dist-server \( -name '.env*' -o -name '*.env' -o -name '*.pem' -o -name '*.key' \) -delete
          printf '{"sha":"%s","ref":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > dist-server/server-dist-manifest.json
          tar -czf chatux-probe-dist.tgz dist dist-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: chatux-probe-dist, path: chatux-probe-dist.tgz, retention-days: 3 }
