name: Chat UX scoped check
on:
  workflow_dispatch:
  workflow_call:
concurrency: { group: "chatux-check-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm vitest run --bail 1
          server/step-summary.test.ts server/routes/bot-messages.test.ts
          src/lib/transcript-derivations.test.ts src/lib/job-status.test.ts src/lib/peer-exchange.test.ts src/lib/job-threads.test.ts
          src/state/turn-status.test.ts src/state/thread-navigation.test.ts src/state/notification-open.test.ts
          src/components/JobPresence.test.ts src/components/JobViewFooter.test.ts src/components/ChatMoreMenu.test.ts
          src/components/ChatView.controls.test.ts src/components/Sidebar.simple-mode.test.ts src/components/Sidebar.working-folder.test.ts
