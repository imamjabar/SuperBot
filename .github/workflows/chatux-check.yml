name: Chat UX scoped check
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      probe_dist: { type: boolean, default: false }
concurrency: { group: "chatux-check-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  probe-dist:
    if: ${{ inputs.probe_dist }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vite build
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - run: pnpm build:server
      - run: |
          test -f dist-server/index.js && test -f dist-server/server-launcher.js
          find dist-server \( -name '.env*' -o -name '*.env' -o -name '*.pem' -o -name '*.key' \) -delete
          printf '{"sha":"%s","ref":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > dist-server/server-dist-manifest.json
          tar -czf chatux-probe-dist.tgz dist dist-server
      - uses: actions/upload-artifact@v4
        with: { name: chatux-probe-dist, path: chatux-probe-dist.tgz, retention-days: 3 }
  scope:
    if: ${{ !inputs.probe_dist }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm vitest run --bail 1
          server/step-summary.test.ts server/routes/bot-messages.test.ts
          src/lib/transcript-derivations.test.ts src/lib/job-status.test.ts src/lib/peer-exchange.test.ts src/lib/job-threads.test.ts
          src/state/turn-status.test.ts src/state/thread-navigation.test.ts src/state/notification-open.test.ts
          src/components/JobPresence.test.ts src/components/JobViewFooter.test.ts src/components/ChatMoreMenu.test.ts
          src/components/ChatView.controls.test.ts src/components/Sidebar.simple-mode.test.ts src/components/Sidebar.working-folder.test.ts
