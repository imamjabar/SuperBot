name: Server image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/imamjabar/superbot-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Smoke and summary
        env:
          IMAGE: ghcr.io/imamjabar/superbot-server:${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST" >/dev/null
          docker run --rm --entrypoint node "$IMAGE@$DIGEST" --version | tee node-version
          grep -q '^v26\.' node-version
          docker run --rm --entrypoint node "$IMAGE@$DIGEST" --check dist-server/index.js
          {
            echo "### Server image"
            echo "- Ref: \`$IMAGE@$DIGEST\`"
            echo "- Node: $(cat node-version)"
            echo "- VPS: \`OMB_BASE_IMAGE=$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
