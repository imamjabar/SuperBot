name: Desktop Mac

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-mac
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS minutes are billed at 10x: stop before installing anything when this version already has its release.
      - name: Skip when this version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists. Bump the version in package.json to build a new DMG."
          fi
      - if: steps.release.outputs.exists != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.release.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile
      - name: Package
        if: steps.release.outputs.exists != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:prepare && pnpm build:speech && pnpm build:cua && pnpm exec electron-builder --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.dmg.sign=false
      - name: Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.dmg --repo "$GITHUB_REPOSITORY" --prerelease --title "SuperBot $TAG" --notes "Unsigned arm64 Mac build. First open: right-click the app, Open."
