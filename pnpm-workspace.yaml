# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
  - "apps/docs"
# Packaging fetches optional binaries for both desktop CPU targets.
supportedArchitectures:
  cpu:
    - arm64
    - x64
allowBuilds:
  electron-nightly: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
  core-js: false # postinstall only prints a funding banner
# Transitive packages whose parents still allow a release with a published advisory: mermaid allows an older dompurify,
# ajv an older fast-uri, rehype-katex and micromark-extension-math an older katex, electron-builder an older minimatch.
# Force the patched releases.
overrides:
  dompurify: 3.4.17
  fast-uri: 3.1.9
  katex: 0.19.1
  minimatch@10: 11.0.5
  "@electron/universal>minimatch": 11.0.5
