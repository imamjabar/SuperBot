# Shared desktop on the VPS; operator steps in docker-compose.computer.md.
services:
  omb:
    group_add: ["113"]
    volumes:
      - superbot_data:/data
      - /var/lib/docker/volumes/superbot_data/_data:/host-data:rw
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server-dist:/app/dist-server:ro
    environment:
      OMB_DATA_DIR: /host-data/.openmausbot
      OMB_LOCAL_VM_IMAGE: ghcr.io/imamjabar/superbot-computer@sha256:eac28caa7855766e7c628faa953640b47ccbf01621aa6dcce1db00f535a9c1a7

volumes:
  superbot_data:
    external: true
